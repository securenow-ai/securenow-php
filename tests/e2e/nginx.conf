# One server per app. PHP-FPM listens on 127.0.0.1:9000.

server {
    listen 8081;
    root /apps/plain/public;
    index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Zero-code start without Composer: auto_prepend_file in public/.user.ini (install.sh).
        # (Not PHP_VALUE here: a value passed over FastCGI sticks to the worker and would leak
        # into the other apps of this pool.)
        fastcgi_pass 127.0.0.1:9000;
    }
}

